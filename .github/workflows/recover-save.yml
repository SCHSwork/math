# Looks for a player's lost cloud save, and can put it back.
# Actions → Recover a cloud save → Run workflow → their username.
# The log shows any old save it finds (level, play time); run it again with
# "restore" set to that save's name to make it their cloud save again.
# To give back a level and play time instead, fill in grant_level / grant_hours.
# The repo is public, so the log only shows summaries, never save contents.
name: Recover a cloud save
on:
  workflow_dispatch:
    inputs:
      username:
        description: "The player's username"
        required: true
      restore:
        description: "Leave empty to just look. To put a save back: its name from the log"
        required: false
        default: ""
      grant_level:
        description: "Give back progress: the level they had (0 = don't)"
        required: false
        default: "0"
      grant_hours:
        description: "Give back progress: hours of play time to add (0 = don't)"
        required: false
        default: "0"
      grant_badges:
        description: "Give back progress: badge ids, comma separated (\"limited\" = all limited-time ones)"
        required: false
        default: ""
      grant_note:
        description: "Give back progress: a short note they see (optional)"
        required: false
        default: ""
permissions:
  contents: read
jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Write the Firebase key
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
      - name: Look for the save
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
          USERNAME: ${{ github.event.inputs.username }}
          RESTORE: ${{ github.event.inputs.restore }}
          GRANT_LEVEL: ${{ github.event.inputs.grant_level }}
          GRANT_HOURS: ${{ github.event.inputs.grant_hours }}
          GRANT_BADGES: ${{ github.event.inputs.grant_badges }}
          GRANT_NOTE: ${{ github.event.inputs.grant_note }}
        run: |
          npm i --no-save --silent firebase-admin@12
          node tools/recover_save.mjs
      - name: Remove the key
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json"
