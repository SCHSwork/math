# Publishes config/firestore.rules to Firebase whenever it changes on main,
# so nobody has to paste it into the Firebase console by hand.
# Needs a repository secret FIREBASE_SERVICE_ACCOUNT: the JSON key from
# Firebase console → Project settings → Service accounts → Generate new private key.
# The key only needs the Firebase Rules API, which the Admin SDK key has.
name: Publish Firestore rules
on:
  push:
    branches: [main]
    paths: [config/firestore.rules]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: firestore-rules
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for the Firebase key
        id: key
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA" ]; then
            echo "::warning::No FIREBASE_SERVICE_ACCOUNT secret yet, so the rules weren't published. Paste config/firestore.rules into the Firebase console, or add the secret."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
            # Check the key is a complete service account file, without printing it
            python3 - "$RUNNER_TEMP/sa.json" <<'PY' || { rm -f "$RUNNER_TEMP/sa.json"; exit 1; }
          import json, sys
          raw = open(sys.argv[1]).read()
          try:
              # strict=False accepts real line breaks inside the key, which phones
              # add when copying it; the file is then rewritten as normal JSON.
              d = json.loads(raw, strict=False)
          except Exception as e:
              print(f"::error::The FIREBASE_SERVICE_ACCOUNT secret isn't valid JSON ({type(e).__name__} near character {getattr(e, 'pos', '?')} of {len(raw)}). Paste the whole downloaded .json file again, from the first {{ to the last }}.")
              sys.exit(1)
          missing = [k for k in ("type", "project_id", "private_key", "client_email") if not d.get(k)]
          if missing or d.get("type") != "service_account":
              print(f"::error::The secret is JSON but not a service account key (missing: {', '.join(missing) or 'type=service_account'}).")
              sys.exit(1)
          if "-----END PRIVATE KEY-----" not in d["private_key"]:
              print("::error::The secret's private_key is cut off. Paste the whole downloaded .json file again.")
              sys.exit(1)
          json.dump(d, open(sys.argv[1], "w"))
          print(f"::notice::Key looks complete: {d['client_email']} for project {d['project_id']}")
          PY
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish rules
        if: steps.key.outputs.ok == 'true'
        env:
          KEY_FILE: ${{ runner.temp }}/sa.json
        run: |
          pip install --quiet google-auth requests
          python3 - <<'PY'
          # Uses the Firebase Rules API directly: make a ruleset from the file,
          # then point the database's live rules at it.
          import os, sys, requests
          from google.oauth2 import service_account
          from google.auth.transport.requests import Request
          PROJECT = "gn-math-dfd85"
          creds = service_account.Credentials.from_service_account_file(
              os.environ["KEY_FILE"], scopes=["https://www.googleapis.com/auth/cloud-platform"])
          creds.refresh(Request())
          h = {"Authorization": f"Bearer {creds.token}"}
          api = f"https://firebaserules.googleapis.com/v1/projects/{PROJECT}"
          src = open("config/firestore.rules").read()
          r = requests.post(f"{api}/rulesets", headers=h, json={"source": {"files": [{"name": "firestore.rules", "content": src}]}})
          if not r.ok:
              print(f"::error::Firebase didn't accept the rules ({r.status_code}): {r.text[:600]}")
              sys.exit(1)
          ruleset = r.json()["name"]
          release = f"projects/{PROJECT}/releases/cloud.firestore"
          r = requests.patch(f"https://firebaserules.googleapis.com/v1/{release}", headers=h, json={"release": {"name": release, "rulesetName": ruleset}})
          if not r.ok:
              print(f"::error::Couldn't switch Firestore to the new rules ({r.status_code}): {r.text[:600]}")
              sys.exit(1)
          print(f"::notice::Published config/firestore.rules to Firebase ({ruleset.split('/')[-1]}).")
          PY
      - name: Remove the key
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json"
