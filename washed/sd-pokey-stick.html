<script>
// GN 2.0: stand-in for game ad/portal SDKs (Poki, Yandex, GameMonetize, CrazyGames,
// GameDistribution…). Same calls, no ads or tracking; "ad finished" callbacks run at once.
(function () {
  function stub() {
    var fn = function () {
      for (var i = 0; i < arguments.length; i++) { var a = arguments[i];
        if (a && typeof a === "object") { var cb = a.callbacks || a;
          ["onClose", "onRewarded", "onComplete", "adFinished", "afterAd", "adComplete", "onAdFinished", "onFinish"].forEach(function (k) { if (typeof cb[k] === "function") setTimeout(function () { try { cb[k](true); } catch (e) {} }, 0); }); }
        if (typeof a === "function" && i === arguments.length - 1 && arguments.length > 1) setTimeout(function () { try { a(); } catch (e) {} }, 0); }
      return Promise.resolve(p);
    };
    var p = new Proxy(fn, { get: function (t, k) { if (k === "then") return undefined; if (k === Symbol.toPrimitive) return function () { return ""; };
      if (k === "isAdBlocked" || k === "adblockDetected") return function () { return false; }; if (!(k in t)) t[k] = stub(); return t[k]; },
      apply: function (t, self, args) { return fn.apply(self, args); } });
    return p;
  }
  ["PokiSDK", "YaGames", "ysdk", "sdk", "gdsdk", "CrazyGames", "GameDistribution", "SDK", "aiptag", "adsbygoogle", "gtag", "ga", "ym", "GameSnacks"].forEach(function (n) { try { if (!(n in window)) window[n] = stub(); } catch (e) {} });
})();
</script>

    <script>
      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        // Mobile device style: fill the whole browser client area with the game canvas:
        var meta = document.createElement('meta');
        meta.name = 'viewport';

        document.getElementsByTagName('head')[0].appendChild(meta);
      }

      createUnityInstance(document.querySelector("#unity-canvas"), {
      dataUrl: "pokey-stick.data",
        frameworkUrl: "pokey-stick.framework.js",
        codeUrl: "pokey-stick.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Nevar Games",

        productVersion: "0.1",
      },UnityProgress);
      
      function UnityProgress( progress) {
          var  bar = document.getElementById("progressBar")
    bar.style.width = (300 * progress) + "px";
    if(progress >= 1)
        document.getElementById("loadingBox").style.display = "none";
}

    <script>/* adaptation.javascript (inlined: jsDelivr serves .javascript files with a type browsers won't run) */
(function(){
    const q = (selector) => document.querySelector(selector);

    const gCanvasElement = q('#unity-canvas');
    const gameContainer = q('body')    

    const initialDimensions = {width: parseInt(gCanvasElement.style.width, 10), height: parseInt(gCanvasElement.style.height, 10)};

    gameContainer.style.width = '100%';
    gameContainer.style.height = '100%';

    const getCanvasFromMutationsList = (mutationsList) => {
        for (let mutationItem of mutationsList){
            for (let addedNode of mutationItem.addedNodes){
                if (addedNode.id === '#canvas'){
                    return addedNode;
                }
            }
        }
        return null;
    }

    const setDimensions = () => {
        gameContainer.style.position = 'absolute';
        gameContainer.style.overflow = 'hidden';
        var winW = parseInt(window.getComputedStyle(gameContainer).width, 10);
        var winH = parseInt(window.getComputedStyle(gameContainer).height, 10);

        const widthDim = initialDimensions.width == 0 ? minW : winW / initialDimensions.width;
        const heightDim = initialDimensions.height == 0 ? winH : winH / initialDimensions.height;

        var scale = Math.min(widthDim, heightDim);

        gCanvasElement.style.display = '';
        gCanvasElement.style.overflow = 'hidden';
        gCanvasElement.setAttribute('scrolling','no');

        var fitW = Math.round(initialDimensions.width * scale * 100) / 100;
        var fitH = Math.round(initialDimensions.height * scale * 100) / 100;

        gCanvasElement.style.width = fitW + "px";
        gCanvasElement.style.height = fitH + "px";
    }

    window.setDimensions = setDimensions;

    const registerCanvasWatcher = () => {
        let debounceTimeout = null;
        const debouncedSetDimensions = () => {
            if (debounceTimeout !== null) {
                clearTimeout(debounceTimeout);
            }
            debounceTimeout = setTimeout(setDimensions, 200);
        }
        window.addEventListener('resize', debouncedSetDimensions, false);
        setDimensions();
    }

    const i = 0;
    registerCanvasWatcher();

    new MutationObserver(function (attributesMutation) {
        this.disconnect();
        setTimeout(setDimensions, 1)                
    }).observe(gameContainer, {attributes:true});
})();
