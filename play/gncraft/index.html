<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GN Craft</title>
<!--
  GN Craft: Eaglercraft 1.12.2 (WASM) with the GN Craft server already in the
  Multiplayer list (wss://eagler.learnresearch.org, through GN Proxy on the
  GN 2.0 Server). Players must be signed in to GN 2.0: this page gets a join
  pass for their account from the GN 2.0 Server and puts it in the server
  address, and GN Proxy lets them in under their GN 2.0 username. The game is the same checked UBZone file as "Eaglercraft 1.12
  (WASM)" (js/ubzone.js), from the exact checked commit below; only its server
  list is changed before it starts. Opens in its own tab like other play/ pages.
-->
<style>
  html, body { margin: 0; height: 100%; background: #111; color: #eee; font-family: Arial, sans-serif; }
  #msg { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; text-align: center; padding: 20px; }
  #bar { width: min(320px, 80vw); height: 8px; background: #333; border-radius: 4px; overflow: hidden; }
  #fill { height: 100%; width: 0; background: #4ade80; transition: width .2s; }
  small { color: #999; }
</style>
</head>
<body>
<div id="msg">
  <b style="font-size:22px;">GN Craft</b>
  <div id="text">Loading Minecraft (about 20 MB)…</div>
  <div id="bar"><div id="fill"></div></div>
  <small id="sub">Checking your GN 2.0 sign-in…</small>
</div>
<script>
"use strict";
(async () => {
  const REPO = "s0n-1m-cr1n3/sc13nc3", SHA = "3096333fcce4d7a42ce18f59725abb62d5811116";
  const FILE = "assets/html/main/wasm112.html";   // 1.12: fewer translation problems than 1.8 on GN Craft (26.3)
  const urls = [
    `https://cdn.jsdelivr.net/gh/${REPO}@${SHA}/${FILE}`,
    `https://fastly.jsdelivr.net/gh/${REPO}@${SHA}/${FILE}`,
    `https://raw.githubusercontent.com/${REPO}/${SHA}/${FILE}`,
    `https://gcore.jsdelivr.net/gh/${REPO}@${SHA}/${FILE}`,
    `https://data.learnresearch.org/gh/${REPO}@${SHA}/${FILE}`
  ];
  const text = document.getElementById("text"), fill = document.getElementById("fill"), sub = document.getElementById("sub");
  const stop = (msg, link) => {
    text.textContent = msg; document.getElementById("bar").style.display = "none";
    sub.innerHTML = link ? `<a href="../../" target="_top" style="color:#4ade80;">Go to GN 2.0 to sign in</a>` : "";
  };
  // Signed in to GN 2.0? (same Firebase project and saved sign-in as the site, js/accounts.js)
  const load = src => new Promise((ok, bad) => { const s = document.createElement("script"); s.src = src; s.onload = ok; s.onerror = bad; document.head.appendChild(s); });
  let pass;
  try {
    const base = "https://www.gstatic.com/firebasejs/10.12.2";
    await load(base + "/firebase-app-compat.js"); await load(base + "/firebase-auth-compat.js");
    firebase.initializeApp({ apiKey: "AIzaSyCVUtHKcMZCs7aaCcO_Gp8fmy41MZnjqcs", authDomain: "gn-math-dfd85.firebaseapp.com", projectId: "gn-math-dfd85" });
    const user = await new Promise(r => { const off = firebase.auth().onAuthStateChanged(u => { off(); r(u); }); });
    if (!user) return stop("Sign in to GN 2.0 to play GN Craft. Your GN 2.0 username is your name in the game.", true);
    const r = await fetch("https://data.learnresearch.org/api/mc/ticket", { method: "POST", headers: { Authorization: "Bearer " + await user.getIdToken() } });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) return stop(d.error || "GN Craft can't be reached right now. Try again in a few minutes.", r.status === 401);
    pass = d;
    sub.textContent = "You'll play as " + d.name + ". You'll go straight into GN Craft.";
  } catch (e) {
    return stop("Couldn't check your GN 2.0 sign-in. Check your connection and reload.");
  }
  let html = null;
  for (const u of urls) {
    try {
      const r = await fetch(u);
      if (!r.ok) continue;
      const total = Number(r.headers.get("content-length")) || 20103742;
      const reader = r.body.getReader(), parts = [];
      let got = 0;
      for (;;) {
        const { done, value } = await reader.read();
        if (done) break;
        parts.push(value); got += value.length;
        fill.style.width = Math.min(100, got / total * 100) + "%";
      }
      html = await new Blob(parts).text();
      if (html.includes("eaglercraftXOpts")) break;
      html = null;
    } catch {}
  }
  if (!html) { text.textContent = "Couldn't download the game. Check your connection and reload."; return; }
  // The files list one or two servers of their own; swap the whole list for GN Craft
  const servers = `servers: [
        { addr: "${pass.server}", name: "§a§lGN Craft§r", hideAddr: true }
    ],`;
  // Own storage names: GN Craft keeps nothing that matters in the browser (the
  // world and players live on the server), and this keeps its settings apart from
  // the site's other Eaglercraft games and out of GN 2.0 cloud saves (js/accounts.js)
  const changed = html.replace(/servers:\s*\[(?:\s*\{[^{}]*\}\s*,?)*\s*\]\s*,/, servers)
    .replace(/worldsDB:\s*"worlds"\s*,/, 'worldsDB: "gncraft_worlds", localStorageNamespace: "_gncraft",')
    // Straight into GN Craft when the game starts (no menus); the server is also
    // first in Multiplayer for rejoining after a disconnect
    .replace(/servers:\s*\[/, () => `joinServer: "${pass.server}",\n    servers: [`);
  if (changed === html) console.warn("GN Craft: couldn't add the server to the list; reload this page");
  document.open();
  document.write(changed);
  document.close();
})();
</script>
</body>
</html>
