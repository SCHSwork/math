/* Card size variants */
body.cards-small  #container, body.cards-small  #featuredZones { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
body.cards-large  #container, body.cards-large  #featuredZones { grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
body.cards-list   #container, body.cards-list   #featuredZones {
    grid-template-columns: 1fr;
    gap: 0.5rem;
}
body.cards-list .zone-item { flex-direction: row; align-items: center; }
body.cards-list .zone-item img { width: 64px; height: 64px; aspect-ratio: 1; flex-shrink: 0; }
body.cards-list .zone-item button { flex: 1; text-align: left; padding: 0.75rem 1rem; min-height: unset; }
body.cards-list .zone-actions { padding: 0 0.75rem 0 0; flex-shrink: 0; }

/* Font size */
body.font-small { font-size: 13px; }
body.font-large { font-size: 17px; }

/* Compact header */
body.compact-mode header .header-content { padding: 0.6rem 1rem; }
body.compact-mode .logo { font-size: 1.3rem; }
body.compact-mode main { padding-top: 1rem; }

* {
    box-sizing: border-box;
}

body {
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', system-ui, sans-serif;
    line-height: 1.6;
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    font-weight: 400;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
}

header {
    background: var(--gradient-primary);
    color: white;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: var(--shadow-lg);
    backdrop-filter: blur(20px);
}

.header-content {
    max-width: 1200px;
    margin: 0 auto;
    padding: 1.25rem 1rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1.5rem;
}

.logo {
    font-size: 1.75rem;
    font-weight: 800;
    letter-spacing: -0.02em;
    background: linear-gradient(135deg, #ffffff 0%, rgba(255, 255, 255, 0.8) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
}

.search-container {
    display: flex;
    flex: 1;
    max-width: 500px;
    gap: 0.75rem;
}

#searchBar {
    flex: 1;
    padding: 0.875rem 1rem;
    border: 0;
    border-radius: var(--radius);
    background: var(--glass);
    backdrop-filter: blur(20px);
    color: var(--text);
    font-size: 15px;
    outline: none;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    box-shadow: var(--shadow-sm);
}

#searchBar:focus {
    background: var(--text);
    box-shadow: 0 0 0 3px rgba(252, 38, 81, 0.25), var(--shadow);
    transform: translateY(-1px);
    color: var(--glass);
}

#searchBar::placeholder {
    color: var(--text-muted);
}

#sortOptions {
    padding: 0.875rem 1rem;
    border: 0;
    border-radius: var(--radius);
    background: var(--glass);
    backdrop-filter: blur(20px);
    color: var(--text-muted);
    font-size: 15px;
    cursor: pointer;
    outline: none;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    min-width: 130px;
    box-shadow: var(--shadow-sm);
}

#sortOptions:hover {
    background: var(--text);
    transform: translateY(-1px);
    box-shadow: var(--shadow);
    color: var(--glass);
}

#filterOptions {
    padding: 0.875rem 1rem;
    border: 0;
    border-radius: var(--radius);
    background: var(--glass);
    backdrop-filter: blur(20px);
    color: var(--text-muted);
    font-size: 15px;
    cursor: pointer;
    outline: none;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    min-width: 130px;
    box-shadow: var(--shadow-sm);
}

#filterOptions:hover {
    background: var(--text);
    transform: translateY(-1px);
    box-shadow: var(--shadow);
    color: var(--glass);
}

#tab-preview-cloak-overlay {
    position: fixed;
    inset: 0;
    background: #8a8a8a;
    z-index: 999999;
    display: none;
    pointer-events: none;
}

.control-buttons {
    display: flex;
    gap: 0.5rem;
}

main {
    margin: 0 auto;
    padding: 2rem 1rem;
    padding-bottom: 6rem;
}

#zoneCount {
    margin: 0 0 1.5rem;
    font-size: 14px;
    color: var(--text-muted);
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 0.5rem;
}

#zoneCount::before {
    content: '';
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: var(--primary);
}

#container,
#featuredZones {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 1.5rem;
}

.zone-item {
    background: var(--gradient-surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    overflow: hidden;
    cursor: pointer;
    transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    display: flex;
    flex-direction: column;
    position: relative;
    box-shadow: var(--shadow-sm);
}

.zone-item:hover {
    transform: translateY(-8px) scale(1.02);
    box-shadow: var(--shadow-xl);
    border-color: var(--primary);
}

.zone-item:hover::before {
    opacity: 1;
}

.zone-item::before {
    content: '';
    position: absolute;
    inset: 0;
    background: var(--primary-light);
    opacity: 0;
    transition: opacity 0.4s ease;
    pointer-events: none;
    z-index: 1;
}

.zone-item img {
    width: 100%;
    aspect-ratio: 1;
    object-fit: cover;
    display: block;
    background: var(--border-light);
    transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
}

.zone-item:hover img {
    transform: scale(1.05);
}

.zone-item button {
    background: transparent;
    color: var(--text);
    border: 0;
    padding: 1.25rem 1rem;
    cursor: pointer;
    font-weight: 600;
    font-size: 14px;
    line-height: 1.4;
    text-align: center;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    min-height: 70px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    z-index: 2;
}

.zone-item:hover button {
    color: var(--primary);
    background: rgba(252, 38, 81, 0.05);
}

.zone-actions {
    display: flex;
    gap: 0.5rem;
    padding: 0 1rem 1rem;
    position: relative;
    z-index: 2;
}



#owner-site-overlay {
    position: fixed;
    inset: 0;
    z-index: 1000000;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--text);
    padding: 1.5rem;
    text-align: center;
}

#owner-site-overlay.shutdown-mode {
    background: #0a0a0a;
    background-image:
        repeating-linear-gradient(
            45deg,
            transparent,
            transparent 40px,
            rgba(180,0,0,0.04) 40px,
            rgba(180,0,0,0.04) 80px
        );
}

.owner-site-message {
    max-width: 520px;
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    background: var(--surface);
    box-shadow: var(--shadow-xl);
    padding: 2rem;
}

.owner-site-message.shutdown-message {
    background: #111;
    border: 2px solid #8b0000;
    border-radius: 4px;
    box-shadow: 0 0 0 1px #8b0000, 0 0 40px rgba(180,0,0,0.3), 0 8px 40px rgba(0,0,0,0.9);
    padding: 2.5rem 2rem;
}

.shutdown-badge {
    display: inline-block;
    background: #8b0000;
    color: #fff;
    font-size: 10px;
    font-weight: 800;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    padding: 3px 10px;
    border-radius: 2px;
    margin-bottom: 1.25rem;
}

.shutdown-icon {
    font-size: 3rem;
    line-height: 1;
    margin-bottom: 0.75rem;
    display: block;
    filter: drop-shadow(0 0 12px rgba(200,0,0,0.6));
}

.owner-site-message.shutdown-message h1 {
    color: #ff2222;
    font-size: 1.6rem;
    font-weight: 900;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    margin: 0 0 0.75rem;
    text-shadow: 0 0 20px rgba(255,30,30,0.5);
}

.owner-site-message.shutdown-message p {
    color: #999;
    font-size: 0.9rem;
    line-height: 1.6;
    margin: 0 0 1.5rem;
}

.shutdown-divider {
    border: none;
    border-top: 1px solid #2a0000;
    margin: 1.25rem 0;
}

.shutdown-unlock {
    background: transparent !important;
    border: 1px solid #444 !important;
    color: #555 !important;
    font-size: 11px !important;
    letter-spacing: 0.1em;
    padding: 6px 14px !important;
    border-radius: 2px !important;
    cursor: pointer;
    transition: border-color 0.2s, color 0.2s;
}

.shutdown-unlock:hover {
    border-color: #8b0000 !important;
    color: #aaa !important;
}

.owner-site-message h1 {
    margin: 0 0 0.75rem;
}

.owner-panel-list {
    max-height: 320px;
    overflow: auto;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 0.5rem;
    background: var(--bg-secondary);
}

.owner-game-toggle {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    padding: 0.5rem;
    border-bottom: 1px solid var(--border-light);
}

.owner-game-toggle:last-child {
    border-bottom: 0;
}

.owner-game-name {
    min-width: 0;
    overflow-wrap: anywhere;
}

#zoneViewer {
    position: fixed;
    inset: 0;
    background: var(--bg);
    z-index: 1000;
    display: none;
    flex-direction: column;
    animation: slideInUp 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}

@keyframes slideInUp {
    from {
        transform: translateY(100%);
    }
    to {
        transform: translateY(0);
    }
}

.zone-header {
    background: var(--gradient-primary);
    color: white;
    padding: 0.4rem 1.5rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: var(--shadow-lg);
}

.zone-title {
    flex: 1;
    min-width: 0;
}

#zoneName {
    font-size: 1.25rem;
    font-weight: 700;
    margin: 0 0 0.25rem;
    line-height: 1.3;
}

#zoneId {
    display: none;
}

#zoneAuthor {
    font-size: 14px;
    color: rgba(255, 255, 255, 0.8);
    text-decoration: none;
    transition: all 0.2s ease;
    font-weight: 500;
}

#zoneAuthor:hover {
    color: white;
    text-decoration: underline;
}

.zone-controls {
    display: flex;
    gap: 0.75rem;
}

.zone-controls button {
    background: rgba(255, 255, 255, 0.1);
    border: 1px solid rgba(255, 255, 255, 0.3);
    color: white;
    padding: 0.625rem 1rem;
    border-radius: var(--radius);
    cursor: pointer;
    font-size: 14px;
    font-weight: 600;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    backdrop-filter: blur(20px);
}

.zone-controls button:hover {
    background: rgba(255, 255, 255, 0.2);
    border-color: rgba(255, 255, 255, 0.5);
    transform: translateY(-1px);
    box-shadow: var(--shadow);
}

#zoneFrame {
    flex-grow: 1;
    border: none;
    width: 90%;
    height: 90%;
}

#popupOverlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.6);
    backdrop-filter: blur(8px);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 2000;
    padding: 1rem;
    animation: fadeIn 0.3s ease;
}

@keyframes fadeIn {
    from {
        opacity: 0;
    }
    to {
        opacity: 1;
    }
}

.popup {
    background: var(--surface);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-xl);
    width: 100%;
    max-width: 520px;
    max-height: 80vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    border: 1px solid var(--border);
    animation: slideInScale 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}

@keyframes slideInScale {
    from {
        transform: scale(0.9) translateY(20px);
        opacity: 0;
    }
    to {
        transform: scale(1) translateY(0);
        opacity: 1;
    }
}

.popup-header {
    background: var(--gradient-primary);
    color: white;
    padding: 1.25rem 1.5rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

#popupTitle {
    margin: 0;
    font-size: 1.25rem;
    font-weight: 700;
}

#popupClose {
    background: rgba(255, 255, 255, 0.1);
    border: 0;
    color: white;
    font-size: 1.25rem;
    cursor: pointer;
    padding: 0.5rem;
    border-radius: var(--radius);
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    line-height: 1;
    width: 36px;
    height: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
    backdrop-filter: blur(20px);
}

#popupClose:hover {
    background: rgba(255, 255, 255, 0.2);
    transform: scale(1.1);
}

#popupBody {
    padding: 1.5rem;
    overflow-y: auto;
    color: var(--text);
}

#popupBody input[type="text"],
#popupBody input[type="file"] {
    width: 100%;
    padding: 0.875rem 1rem;
    margin-bottom: 1.25rem;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: var(--bg-secondary);
    color: var(--text);
    font-size: 15px;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    outline: none;
}

#popupBody input[type="text"]:focus,
#popupBody input[type="file"]:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(252, 38, 81, 0.1);
    transform: translateY(-1px);
}

footer {
    background: var(--bg-secondary);
    border-top: 1px solid var(--border);
    padding: 1rem 1rem;
    text-align: center;

    position: fixed;
    bottom: 0;
    left: 0;
    width: 100%;
    z-index: 100;
}

.footer-links {
    display: flex;

    <script>
const container = document.getElementById('container');
const zoneViewer = document.getElementById('zoneViewer');
let zoneFrame = document.getElementById('zoneFrame');
const searchBar = document.getElementById('searchBar');
const sortOptions = document.getElementById('sortOptions');
const filterOptions = document.getElementById('filterOptions');
// https://www.jsdelivr.com/tools/purge
const zonesurls = [
    "https://cdn.jsdelivr.net/gh/freebuisness/assets@main/zones.json",
    "https://cdn.jsdelivr.net/gh/freebuisness/assets@latest/zones.json",
    "https://cdn.jsdelivr.net/gh/freebuisness/assets@master/zones.json",
    "https://cdn.jsdelivr.net/gh/freebuisness/assets/zones.json"
];
let zonesURL = zonesurls[Math.floor(Math.random() * zonesurls.length)];
const coverURL = "https://cdn.jsdelivr.net/gh/freebuisness/covers@main";
const htmlURL = "https://cdn.jsdelivr.net/gh/freebuisness/html@main";
const htmlURLFallbacks = [
    "https://cdn.jsdelivr.net/gh/freebuisness/html@latest",
    "https://cdn.jsdelivr.net/gh/freebuisness/html",
    "https://raw.githubusercontent.com/freebuisness/html/main"
];
let zones = [];
let popularityData = {};
const featuredContainer = document.getElementById('featuredZones');
const randomZoneButton = document.getElementById('randomZoneButton');
function toTitleCase(str) {
  return str.replace(
    /\w\S*/g,
    text => text.charAt(0).toUpperCase() + text.substring(1).toLowerCase()
  );
}
async function listZones() {
    try {
      let sharesponse;
      let shajson;
      let sha;
        try {
          sharesponse = await fetch("https://api.github.com/repos/freebuisness/assets/commits?t="+Date.now());
        } catch (error) {}
        if (sharesponse && sharesponse.status === 200) {
          try {
            shajson = await sharesponse.json();
            sha = shajson[0]['sha'];
            if (sha) {
                zonesURL = `https://cdn.jsdelivr.net/gh/freebuisness/assets@${sha}/zones.json`;
            }
          } catch (error) {
            try {
                let secondarysharesponse = await fetch("https://raw.githubusercontent.com/freebuisness/xml/refs/heads/main/sha.txt?t="+Date.now());
                if (secondarysharesponse && secondarysharesponse.status === 200) {
                    sha = (await secondarysharesponse.text()).trim();
                    if (sha) {
                        zonesURL = `https://cdn.jsdelivr.net/gh/freebuisness/assets@${sha}/zones.json`;
                    }
                }
            } catch(error) {}
          }
        }
        const response = await fetch(zonesURL+"?t="+Date.now());
        const json = await response.json();
        zones = json;
        zones[0].featured = true; // always gonna be the discord
        randomZoneButton.disabled = false;
        await Promise.all([fetchPopularity("year"), fetchPopularity("month"), fetchPopularity("week"), fetchPopularity("day")]);
        sortZones();
        try {
        const search = new URLSearchParams(window.location.search);
        const id = search.get('id');
        const embed = window.location.hash.includes("embed");
        if (id) {
            const zone = zones.find(zone => zone.id + '' == id + '');
            if (zone) {
                if (embed) {
                    if (zone.url.startsWith("http")) {
                        window.open(zone.url, "_blank");
                    } else {
                        fetchWithFallback(zone.url).then(html => {
                            document.documentElement.innerHTML = html;
                            const popup = document.createElement("div");
                            popup.style.position = "fixed";
                            popup.style.bottom = "20px";
                            popup.style.right = "20px";
                            popup.style.backgroundColor = "#cce5ff";
                            popup.style.color = "#004085";
                            popup.style.padding = "10px";
                            popup.style.border = "1px solid #b8daff";
                            popup.style.borderRadius = "5px";
                            popup.style.boxShadow = "0px 0px 10px rgba(0,0,0,0.1)";
                            popup.style.fontFamily = "Arial, sans-serif";
                            
                            popup.innerHTML = `Play more games at <a href="https://gn-math.dev" target="_blank" style="color:#004085; font-weight:bold;">https://gn-math.dev</a>!`;
                            
                            const closeBtn = document.createElement("button");
                            closeBtn.innerText = "?";
                            closeBtn.style.marginLeft = "10px";
                            closeBtn.style.background = "none";
                            closeBtn.style.border = "none";
                            closeBtn.style.cursor = "pointer";
                            closeBtn.style.color = "#004085";
                            closeBtn.style.fontWeight = "bold";
                            
                            closeBtn.onclick = () => popup.remove();
                            popup.appendChild(closeBtn);
                            document.body.appendChild(popup);
                            document.documentElement.querySelectorAll('script').forEach(oldScript => {
                                const newScript = document.createElement('script');
                                if (oldScript.src) {
                                    newScript.src = oldScript.src;
                                } else {
                                    newScript.textContent = oldScript.textContent;
                                }
                                document.body.appendChild(newScript);
                            });
                        }).catch(error => alert("Failed to load zone: " + error));
                    }
                } else {
                    openZone(zone);
                }
            }
        }
        } catch(error){}
        let alltags = [];
        for (const obj of json) {
            if (Array.isArray(obj.special)) {
                alltags.push(...obj.special);
            }
        }

        alltags = [...new Set(alltags)];
        let filteroption = document.getElementById("filterOptions");
        if (filteroption && filteroption.children.length > 1) {
            while (filteroption.children.length > 1) {
                filteroption.removeChild(filteroption.lastElementChild);
            }
        }
        for (const tag of alltags) {
            const opt = document.createElement("option");
            opt.value = tag;
            opt.textContent = toTitleCase(tag);
            filteroption.appendChild(opt);
        }
    } catch (error) {
        console.error(error);
        randomZoneButton.disabled = true;
        container.innerHTML = `Error loading zones: ${error}`;
    }
}

function openRandomZone() {
    const availableZones = zones.filter(zone => zone && zone.id !== -1 && !isZoneDisabled(zone.id));
    if (availableZones.length === 0) {
        alert("No zones are available to play right now.");
        return;
    }

    const randomZone = availableZones[Math.floor(Math.random() * availableZones.length)];
    openZone(randomZone);
}

async function fetchPopularity(duration) {
    try {
        if (!popularityData[duration]) {
            popularityData[duration] = {};
        }
        const response = await fetch(
            "https://data.jsdelivr.com/v1/stats/packages/gh/freebuisness/html@main/files?period=" + duration
        );
        const data = await response.json();
        data.forEach(file => {
            const idMatch = file.name.match(/\/(\d+)\.html$/);
            if (idMatch) {
                const id = parseInt(idMatch[1]);
                popularityData[duration][id] = file.hits?.total ?? 0;
            }
        });
    } catch (error) {
        if (!popularityData[duration]) {
            popularityData[duration] = {};
        }
        popularityData[duration][0] = 0;
    }
}


function sortZones() {
    const sortBy = sortOptions.value;
    if (sortBy === 'name') {
        zones.sort((a, b) => a.name.localeCompare(b.name));
    } else if (sortBy === 'id') {
        zones.sort((a, b) => a.id - b.id);
    } else if (sortBy === 'popular') {
        zones.sort((a, b) => ((popularityData['year']?.[b.id]) ?? 0) - ((popularityData['year']?.[a.id]) ?? 0));
    } else if (sortBy === 'trendingMonth') {
        zones.sort((a, b) => ((popularityData['month']?.[b.id]) ?? 0) - ((popularityData['month']?.[a.id]) ?? 0));
    } else if (sortBy === 'trendingWeek') {
        zones.sort((a, b) => ((popularityData['week']?.[b.id]) ?? 0) - ((popularityData['week']?.[a.id]) ?? 0));
    } else if (sortBy === 'trendingDay') {
        zones.sort((a, b) => ((popularityData['day']?.[b.id]) ?? 0) - ((popularityData['day']?.[a.id]) ?? 0));
    }
    zones.sort((a, b) => (a.id === -1 ? -1 : b.id === -1 ? 1 : 0));
    if (featuredContainer.innerHTML === "") {
        const featured = zones.filter(z => z.featured);
        displayFeaturedZones(featured);
    }
    displayZones(zones);
}

function createZoneCard(file) {
    const zoneItem = document.createElement("div");
    zoneItem.className = "zone-item";
    zoneItem.onclick = () => openZone(file);

    const img = document.createElement("img");
    img.dataset.src = file.cover.replace("{COVER_URL}", coverURL).replace("{HTML_URL}", htmlURL);
    img.alt = file.name;
    img.loading = "lazy";
    img.className = "lazy-zone-img";
    zoneItem.appendChild(img);

    const button = document.createElement("button");
    button.textContent = file.name;
    button.onclick = (event) => {
        event.stopPropagation();
        openZone(file);
    };
    zoneItem.appendChild(button);

    // Play count badge
    if (getShowPlayCount()) {
        const plays = (popularityData['year']?.[file.id]) ?? 0;
        if (plays > 0) {
            const badge = document.createElement("div");
            badge.style.cssText = "font-size:11px;color:var(--text-muted);text-align:center;padding:0 0.75rem 0.4rem;";
            badge.textContent = "▶ " + plays.toLocaleString() + " plays";
            zoneItem.appendChild(badge);
        }
    }

    return zoneItem;
}

function observeLazyZoneImages(selector) {
    const lazyImages = document.querySelectorAll(selector);
    const imageObserver = new IntersectionObserver((entries, observer) => {
        entries.forEach(entry => {
            if (entry.isIntersecting && !zoneViewer.hidden) {
                const img = entry.target;
                img.src = img.dataset.src;
                img.classList.remove("lazy-zone-img");
                observer.unobserve(img);
            }
        });
    }, {
        rootMargin: "100px", 
        threshold: 0.1
    });

    lazyImages.forEach(img => {
        imageObserver.observe(img);
    });
}

function displayFeaturedZones(featuredZones) {
    featuredContainer.innerHTML = "";
    const visibleFeaturedZones = featuredZones.filter(file => !isZoneDisabled(file.id));
    visibleFeaturedZones.forEach(file => {
        featuredContainer.appendChild(createZoneCard(file));
    });
    if (featuredContainer.innerHTML === "") {
        featuredContainer.innerHTML = "No featured zones found.";
    } else {
        document.getElementById("allZonesSummary").textContent = `Featured Zones (${visibleFeaturedZones.length})`;
    }

    observeLazyZoneImages('#featuredZones img.lazy-zone-img');
}
function displayZones(zones) {
    container.innerHTML = "";
    const visibleZones = zones.filter(file => !isZoneDisabled(file.id));
    visibleZones.forEach(file => {
        container.appendChild(createZoneCard(file));
    });
    if (container.innerHTML === "") {
        container.innerHTML = "No zones found.";
    } else {
        document.getElementById("allSummary").textContent = `All Zones (${visibleZones.length})`;
    }

    observeLazyZoneImages('img.lazy-zone-img');
}

function filterZones2() {
    const query = filterOptions.value;
    if (query === "none") {
        displayZones(zones);
    } else {
        const filteredZones = zones.filter(zone => zone.special?.includes(query));
        if (query.length !== 0) {
            document.getElementById("featuredZonesWrapper").removeAttribute("open");
        }
        displayZones(filteredZones);
    }
}

function filterZones() {
    const query = searchBar.value.toLowerCase();
    const filteredZones = zones.filter(zone => zone.name.toLowerCase().includes(query));
    if (query.length !== 0) {
        document.getElementById("featuredZonesWrapper").removeAttribute("open");
    }
    displayZones(filteredZones);
}

async function fetchWithFallback(rawUrl) {
    // Build a list of candidate URLs: primary htmlURL first, then each fallback
    const suffix = rawUrl.replace("{HTML_URL}", "").replace("{COVER_URL}", "");
    const isHtml = rawUrl.includes("{HTML_URL}");
    const candidates = isHtml
        ? [htmlURL, ...htmlURLFallbacks].map(base => base + suffix)
        : [rawUrl.replace("{COVER_URL}", coverURL).replace("{HTML_URL}", htmlURL)];

    let lastError;
    for (const url of candidates) {
        try {
            const response = await fetch(url);
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            return await response.text();
        } catch (err) {
            lastError = err;
        }
    }
    throw lastError;
}

function openZone(file) {
    if (isZoneDisabled(file.id)) {
        alert("This game is disabled by the owner.");
        return;
    }

    if (file.url.startsWith("http")) {
        window.open(file.url, "_blank");
    } else {
        // Show viewer immediately with a loading indicator
        document.getElementById('zoneName').textContent = file.name;
        document.getElementById('zoneId').textContent = file.id;
        document.getElementById('zoneAuthor').textContent = "by " + file.author;
        if (file.authorLink) {
            document.getElementById('zoneAuthor').href = file.authorLink;
        } else {
            document.getElementById('zoneAuthor').removeAttribute('href');
        }
        zoneViewer.style.display = "flex";
        zoneViewer.hidden = false;
        if (zoneFrame.contentDocument !== null) {
            zoneFrame.contentDocument.open();
            zoneFrame.contentDocument.write('<html><body style="margin:0;display:flex;align-items:center;justify-content:center;height:100vh;background:#0f172a;color:#94a3b8;font-family:sans-serif;font-size:1.2rem;">Loading...</body></html>');
            zoneFrame.contentDocument.close();
        }
        try {
            const locUrl = new URL(window.location);
            locUrl.searchParams.set('id', file.id);
            history.pushState(null, '', locUrl.toString());
        } catch(e){}

        fetchWithFallback(file.url).then(html => {
            if (zoneFrame.contentDocument === null) {
                zoneFrame = document.createElement("iframe");
                zoneFrame.id = "zoneFrame";
                zoneViewer.appendChild(zoneFrame);
            }
            zoneFrame.contentDocument.open();
            zoneFrame.contentDocument.write(html);
            zoneFrame.contentDocument.close();
        }).catch(error => {
            closeZone();
            alert("Failed to load zone: " + error);
        });
    }
}

function sanitizeData(obj, maxStringLen = 1000, maxArrayLen = 10000) {
    if (typeof obj === 'string') {
      return obj.length > maxStringLen ? obj.slice(0, maxStringLen) + '...[truncated]' : obj;
    }
    
    if (obj instanceof Uint8Array) {
      if (obj.length > maxArrayLen) {
        return `[Uint8Array too large (${obj.length} bytes), truncated]`;
      }
      return obj;
    }
    
    if (Array.isArray(obj)) {
      return obj.map(item => sanitizeData(item, maxStringLen, maxArrayLen));
    }
    
    if (obj && typeof obj === 'object') {
      const newObj = {};
      for (const key in obj) {
        if (obj.hasOwnProperty(key)) {
          newObj[key] = sanitizeData(obj[key], maxStringLen, maxArrayLen);
        }
      }
      return newObj;
    }
    
    return obj;
  }

async function saveData() {
    alert("This might take a while, dont touch anything other than this OK button");
    const result = {};
    result.cookies = document.cookie;
    result.localStorage = {...localStorage};
    result.sessionStorage = {...sessionStorage};
    result.indexedDB = {};
    const dbs = await indexedDB.databases();
    for (const dbInfo of dbs) {
      if (!dbInfo.name) continue;
      result.indexedDB[dbInfo.name] = {};
      await new Promise((resolve, reject) => {
        const openRequest = indexedDB.open(dbInfo.name, dbInfo.version);
        openRequest.onerror = () => reject(openRequest.error);
        openRequest.onsuccess = () => {
          const db = openRequest.result;
          const storeNames = Array.from(db.objectStoreNames);
          if (storeNames.length === 0) {
            resolve();
            return;
          }
          const transaction = db.transaction(storeNames, "readonly");
          const storePromises = [];
          for (const storeName of storeNames) {
            result.indexedDB[dbInfo.name][storeName] = [];
            const store = transaction.objectStore(storeName);
            const getAllRequest = store.getAll();
            const p = new Promise((res, rej) => {
              getAllRequest.onsuccess = () => {
                result.indexedDB[dbInfo.name][storeName] = sanitizeData(getAllRequest.result, 1000, 100);
                res();
              };
              getAllRequest.onerror = () => rej(getAllRequest.error);
            });
            storePromises.push(p);
          }
          Promise.all(storePromises).then(() => resolve());
        };
      });
    }

    result.caches = {};
    const cacheNames = await caches.keys();
    for (const cacheName of cacheNames) {
      const cache = await caches.open(cacheName);
      const requests = await cache.keys();
      result.caches[cacheName] = [];
      for (const req of requests) {
        const response = await cache.match(req);
        if (!response) continue;
        const cloned = response.clone();
        const contentType = cloned.headers.get('content-type') || '';
        let body;
        try {
          if (contentType.includes('application/json')) {
            body = await cloned.json();
          } else if (contentType.includes('text') || contentType.includes('javascript')) {
            body = await cloned.text();
          } else {
            const buffer = await cloned.arrayBuffer();
            body = btoa(String.fromCharCode(...new Uint8Array(buffer)));
          }
        } catch (e) {
          body = '[Unable to read body]';
        }
        result.caches[cacheName].push({
          url: req.url,
          body,
          contentType
        });
      }
    }
  
    alert("Done, wait for the download to come");
    const link = document.createElement("a");
    link.href = URL.createObjectURL(new Blob([JSON.stringify(result)], {
        type: "application/octet-stream"
    }));
    link.download = `${Date.now()}.data`;
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
  }
  
  async function loadData(event) {
    const file = event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = async function (e) {
        const data = JSON.parse(e.target.result);
        if (data.cookies) {
            data.cookies.split(';').forEach(cookie => {
              document.cookie = cookie.trim();
            });
          }
        
          if (data.localStorage) {
            for (const key in data.localStorage) {
              localStorage.setItem(key, data.localStorage[key]);
            }
          }
        
          if (data.sessionStorage) {
            for (const key in data.sessionStorage) {
              sessionStorage.setItem(key, data.sessionStorage[key]);
            }
          }
        
          if (data.indexedDB) {
            for (const dbName in data.indexedDB) {
              const stores = data.indexedDB[dbName];
              await new Promise((resolve, reject) => {
                const request = indexedDB.open(dbName, 1);
                request.onupgradeneeded = e => {
                  const db = e.target.result;
                  for (const storeName in stores) {
                    if (!db.objectStoreNames.contains(storeName)) {
                      db.createObjectStore(storeName, { keyPath: 'id', autoIncrement: true });
                    }
                  }
                };
                request.onsuccess = e => {
                  const db = e.target.result;
                  const transaction = db.transaction(Object.keys(stores), 'readwrite');
                  transaction.onerror = () => reject(transaction.error);
                  let pendingStores = Object.keys(stores).length;
        
                  for (const storeName in stores) {
                    const objectStore = transaction.objectStore(storeName);
                    objectStore.clear().onsuccess = () => {
                      for (const item of stores[storeName]) {
                        objectStore.put(item);
                      }
                      pendingStores--;
                      if (pendingStores === 0) resolve();
                    };
                  }
                };
                request.onerror = () => reject(request.error);
              });
            }
          }
        
          if (data.caches) {
            for (const cacheName in data.caches) {
              const cache = await caches.open(cacheName);
              await cache.keys().then(keys => Promise.all(keys.map(k => cache.delete(k)))); // clear existing
        
              for (const entry of data.caches[cacheName]) {
                let responseBody;
                if (entry.contentType.includes('application/json')) {
                  responseBody = JSON.stringify(entry.body);
                } else if (entry.contentType.includes('text') || entry.contentType.includes('javascript')) {
                  responseBody = entry.body;
                } else {
                  const binaryStr = atob(entry.body);
                  const len = binaryStr.length;
                  const bytes = new Uint8Array(len);
                  for (let i = 0; i < len; i++) {
                    bytes[i] = binaryStr.charCodeAt(i);
                  }
                  responseBody = bytes.buffer;
                }
                const headers = new Headers({ 'content-type': entry.contentType });
                const response = new Response(responseBody, { headers });
                await cache.put(entry.url, response);
              }
            }
          }
        alert("Data loaded");
    };
    alert("This might take a while, dont touch anything other than this OK button");
    reader.readAsText(file);
  }


function getJsonStorage(key, fallback) {
    try {
        const storedValue = localStorage.getItem(key);
        return storedValue ? JSON.parse(storedValue) : fallback;
    } catch (error) {
        return fallback;
    }
}

function setJsonStorage(key, value) {
    localStorage.setItem(key, JSON.stringify(value));
}

function getDisabledZoneIds() {
    return new Set(getJsonStorage(OWNER_STORAGE_KEYS.disabledZones, []));
}

function setDisabledZoneIds(disabledIds) {
    setJsonStorage(OWNER_STORAGE_KEYS.disabledZones, Array.from(disabledIds));
}

function isZoneDisabled(zoneId) {
    return getDisabledZoneIds().has(String(zoneId));
}

function setZoneDisabled(zoneId, isDisabled) {
    const disabledIds = getDisabledZoneIds();
    if (isDisabled) {
        disabledIds.add(String(zoneId));
    } else {
        disabledIds.delete(String(zoneId));
    }
    setDisabledZoneIds(disabledIds);
    featuredContainer.innerHTML = "";
    sortZones();
    githubAutoSync();
}

function getBrokenReports() {
    return getJsonStorage(OWNER_STORAGE_KEYS.brokenReports, {});
}

function setBrokenReports(reports) {
    setJsonStorage(OWNER_STORAGE_KEYS.brokenReports, reports);
}

function buildBrokenReportsFile() {
    const reports = getBrokenReports();
    const games = Object.values(reports).sort((a, b) => b.reports - a.reports || a.name.localeCompare(b.name));
    return {
        totalReports: games.reduce((total, game) => total + game.reports, 0),
        games,
        updatedAt: new Date().toISOString()
    };
}

function downloadJsonFile(fileName, data) {
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = fileName;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
}

function saveBrokenReportsFile() {
    downloadJsonFile("broken-reports.json", buildBrokenReportsFile());
}

function reportBrokenZone(file) {
    const zoneId = String(file.id);
    const reports = getBrokenReports();
    const currentReport = reports[zoneId] || {
        id: zoneId,
        name: file.name,
        url: file.url,
        reports: 0,
        firstReportedAt: new Date().toISOString()
    };

    currentReport.name = file.name;
    currentReport.url = file.url;
    currentReport.reports += 1;
    currentReport.lastReportedAt = new Date().toISOString();
    reports[zoneId] = currentReport;
    setBrokenReports(reports);
    alert(`${file.name} reported as broken. Total reports: ${currentReport.reports}.`);
}

function applyOwnerSettingsObject(settings, { rerender = false } = {}) {

    if (typeof settings.siteMode === "string") {

/** Debounced auto-sync — waits 1.5 s after the last change before pushing */
let _autoSyncTimer = null;
function githubAutoSync() {
    if (!getGithubPat()) return;          // no token stored → skip silently
    clearTimeout(_autoSyncTimer);
    _autoSyncTimer = setTimeout(async () => {
        const ok = await githubSyncPush();
        const status = document.getElementById("owner-sync-status");
        if (status) {
            status.textContent = ok
                ? "✓ Auto-saved to GitHub — " + new Date().toLocaleTimeString()
                : "✗ Auto-save failed – check your token";
            status.style.color = ok ? "var(--success)" : "#ef4444";
        }
    }, 1500);
}

/** Push current settings to GitHub. Returns true on success. */
async function githubSyncPush() {
    const pat = getGithubPat();
    if (!pat) return false;

    const content = btoa(unescape(encodeURIComponent(
        JSON.stringify(buildOwnerSettingsObject(), null, 2)
    )));

    // Fetch current SHA (needed for updates)
    let sha;
    try {
        const res = await fetch(GITHUB_SYNC_URL, {
            headers: { Authorization: `token ${pat}`, Accept: "application/vnd.github+json" }
        });
        if (res.ok) {
            const json = await res.json();
            sha = json.sha;
        }
    } catch (_) {}

    const body = { message: "chore: update owner-settings", content };
    if (sha) body.sha = sha;

    const putRes = await fetch(GITHUB_SYNC_URL, {
        method:  "PUT",
        headers: {
            Authorization: `token ${pat}`,
            Accept:        "application/vnd.github+json",
            "Content-Type": "application/json"
        },
        body: JSON.stringify(body)
    });

    return putRes.ok;
}

/** Pull settings from the public CDN (works for all visitors, no token). */
async function githubSyncPull({ rerender = false } = {}) {
    try {
        // Use the GitHub API endpoint instead of raw CDN — CDN caches for up to
        // 5 minutes which means lock/shutdown/open changes don't propagate fast.
        // The API endpoint is always fresh (no CDN cache). No token needed for
        // public repos — it just returns slightly less data per minute on the
        // unauthenticated rate limit (60 req/hr), which is fine for a settings pull.
        const pat = getGithubPat();
        const headers = { Accept: "application/vnd.github+json" };
        if (pat) headers.Authorization = `token ${pat}`;

        const res = await fetch(GITHUB_SYNC_URL + "?t=" + Date.now(), { headers });
        if (!res.ok) return;
        const json = await res.json();

        // API returns base64-encoded content — decode it
        const decoded = decodeURIComponent(escape(atob(json.content.replace(/\n/g, ""))));
        const settings = JSON.parse(decoded);
        applyOwnerSettingsObject(settings, { rerender });
    } catch (_) {}
}

/** Save settings then immediately push to GitHub. Shows status in panel. */
async function ownerSyncSave() {
    const btn    = document.getElementById("owner-sync-btn");
    const status = document.getElementById("owner-sync-status");
    if (btn) { btn.textContent = "Saving…"; btn.disabled = true; }
    if (status) status.textContent = "";
    try {
        const ok = await githubSyncPush();
        if (btn)    { btn.textContent = "Save & Sync to GitHub"; btn.disabled = false; }
        if (status) {
            status.textContent = ok
                ? "✓ Saved to GitHub — all devices will pick this up on next load."
                : "✗ Save failed. Check your token has repo write access.";
            status.style.color = ok ? "var(--success)" : "#ef4444";
        }
    } catch(e) {
        if (btn)    { btn.textContent = "Save & Sync to GitHub"; btn.disabled = false; }
        if (status) { status.textContent = "✗ Error: " + e.message; status.style.color = "#ef4444"; }
    }
}

function clampColor(value) {
    return Math.max(0, Math.min(255, value));
}

function adjustHexColor(hexColor, adjustment) {
    const normalizedHex = (hexColor || "").replace("#", "");
    if (!/^[0-9a-fA-F]{6}$/.test(normalizedHex)) {
        return "#fc2651";
    }

    const r = clampColor(parseInt(normalizedHex.slice(0, 2), 16) + adjustment);
    const g = clampColor(parseInt(normalizedHex.slice(2, 4), 16) + adjustment);
    const b = clampColor(parseInt(normalizedHex.slice(4, 6), 16) + adjustment);

    return `#${r.toString(16).padStart(2, "0")}${g.toString(16).padStart(2, "0")}${b.toString(16).padStart(2, "0")}`;
}

function hexToRgb(hexColor) {
    const normalizedHex = (hexColor || "").replace("#", "");
    if (!/^[0-9a-fA-F]{6}$/.test(normalizedHex)) {
        return { r: 252, g: 38, b: 81 };
    }

    return {
        r: parseInt(normalizedHex.slice(0, 2), 16),
        g: parseInt(normalizedHex.slice(2, 4), 16),
        b: parseInt(normalizedHex.slice(4, 6), 16)
    };
}

function getCustomPrimaryColor() {

function clearCustomPrimaryColorStyles() {
    const style = document.body.style;
    style.removeProperty("--primary");
    style.removeProperty("--primary-hover");
    style.removeProperty("--primary-light");
    style.removeProperty("--primary-lighter");
    style.removeProperty("--shadow-glow");
    style.removeProperty("--gradient-primary");
}

function applyCustomPrimaryColor(hexColor) {
    const safeColor = /^#[0-9a-fA-F]{6}$/.test(hexColor || "") ? hexColor : "#fc2651";
    const hoverColor = adjustHexColor(safeColor, -20);
    const rgb = hexToRgb(safeColor);
    const style = document.body.style;

    style.setProperty("--primary", safeColor);
    style.setProperty("--primary-hover", hoverColor);
    style.setProperty("--primary-light", `rgba(${rgb.r}, ${rgb.g}, ${rgb.b}, 0.15)`);
    style.setProperty("--primary-lighter", `rgba(${rgb.r}, ${rgb.g}, ${rgb.b}, 0.08)`);
    style.setProperty("--shadow-glow", `0 0 20px rgba(${rgb.r}, ${rgb.g}, ${rgb.b}, 0.35)`);
    style.setProperty("--gradient-primary", `linear-gradient(135deg, ${safeColor} 0%, ${hoverColor} 100%)`);
}

function setCustomPrimaryColor(hexColor) {
    const safeColor = /^#[0-9a-fA-F]{6}$/.test(hexColor || "") ? hexColor : "#fc2651";
    localStorage.setItem(APP_SETTINGS_STORAGE_KEYS.customPrimaryColor, safeColor);
    applyCustomPrimaryColor(safeColor);
}

    const sensitivity = localStorage.getItem(PREVIEW_CLOAK_STORAGE_KEYS.sensitivity) || "medium";
    if (!["low", "lowMed", "medium", "high"].includes(sensitivity)) {
        return "medium";
    }
    return sensitivity;
}

function setPreviewCloakSensitivity(sensitivity) {
    const safeSensitivity = ["low", "lowMed", "medium", "high"].includes(sensitivity) ? sensitivity : "medium";
    localStorage.setItem(PREVIEW_CLOAK_STORAGE_KEYS.sensitivity, safeSensitivity);
}

function ensureTabPreviewOverlay() {
    let overlay = document.getElementById("tab-preview-cloak-overlay");
    if (overlay) {
        return overlay;
    }

    overlay = document.createElement("div");
    overlay.id = "tab-preview-cloak-overlay";
    document.body.appendChild(overlay);
    return overlay;
}

function setTabPreviewCloak(enabled) {
    const overlay = ensureTabPreviewOverlay();
    const shouldShow = enabled && getPreviewCloakEnabled();
    overlay.style.display = shouldShow ? "block" : "none";
}

function handlePreviewCloakTrigger(reason) {
    if (!getPreviewCloakEnabled()) {
        setTabPreviewCloak(false);
        return;
    }

    const sensitivity = getPreviewCloakSensitivity();

    if (document.hidden) {
        setTabPreviewCloak(true);
        return;
    }

    if (reason === "blur" && ["lowMed", "medium", "high"].includes(sensitivity)) {
        setTabPreviewCloak(true);
        return;
    }

    if (reason === "mouseleave" && ["medium", "high"].includes(sensitivity)) {
        setTabPreviewCloak(true);
        return;
    }

    if (reason === "windowmouseout" && sensitivity === "high") {
        setTabPreviewCloak(true);
    }
}

function setupTabPreviewCloak() {
    ensureTabPreviewOverlay();

    document.addEventListener("visibilitychange", () => {
        if (document.hidden) {
            setTabPreviewCloak(true);
        } else {
            setTabPreviewCloak(false);
        }
    });

    document.addEventListener("mouseleave", () => handlePreviewCloakTrigger("mouseleave"));
    document.addEventListener("mouseenter", () => {
        if (!document.hidden && document.hasFocus()) {
            setTabPreviewCloak(false);
        }
    });

    window.addEventListener("mouseout", event => {
        if (!event.relatedTarget && !event.toElement) {
            handlePreviewCloakTrigger("windowmouseout");
        }
    });
    window.addEventListener("blur", () => handlePreviewCloakTrigger("blur"));
    window.addEventListener("focus", () => setTabPreviewCloak(false));

}

    if (!link) {

}

let _allStatsCache = null;

async function getAllStats() {
  if (_allStatsCache) {
    return _allStatsCache;
  }

  const BASE_URL =
    "https://data.jsdelivr.com/v1/stats/packages/gh/freebuisness/html@main/files";
  const PERIOD = "year";
  const PAGE_BATCH = 5;

  let page = 1;
  let done = false;
  const combinedMap = Object.create(null);

  while (!done) {
    const pages = Array.from({ length: PAGE_BATCH }, (_, i) => page + i);

    const responses = await Promise.all(
      pages.map(p =>
        fetch(`${BASE_URL}?period=${PERIOD}&page=${p}&limit=100`)
          .then(r => (r.ok ? r.json() : []))
      )
    );

    for (const data of responses) {
      if (!Array.isArray(data) || data.length === 0) {
        done = true;
        break;
      }

      for (const item of data) {
        if (!item?.name) continue;

        const match = item.name.match(/^\/(\d+)([.-])/);
        if (!match) continue;

        const id = match[1];

        if (!combinedMap[id]) {
          combinedMap[id] = {
            hits: 0,
            bandwidth: 0
          };
        }

        combinedMap[id].hits += item.hits?.total ?? 0;
        combinedMap[id].bandwidth += item.bandwidth?.total ?? 0;
      }
    }

    page += PAGE_BATCH;
  }

  _allStatsCache = combinedMap;
  return combinedMap;
}

async function getStats(id) {
  id = String(id);
  const allStats = await getAllStats();

  return allStats[id]?.hits ?? 0;
}

    fetch(`https://api.github.com/repos/freebuisness/html/commits?path=${id}.html`).then(res => res.json()).then(async json => {
        let stats = await getStats (id);
        idjson = zones.filter(a=>a.id===id)[0]
        document.getElementById('popupTitle').textContent = `${idjson.name} Info`;
        const date = new Date(json.at(-1).commit.author.date);
        let formatteddate = new Intl.DateTimeFormat("en-US", {
  month: "long",
  day: "numeric",
  year: "numeric",
  hour: "numeric",
  minute: "2-digit",
  hour12: true
}).format(date);
        popupBody.innerHTML = `
        <p>
        <b>Id</b>: ${id}<br>
        <b>Name</b>: ${idjson.name}<br>
        ${idjson.author?`<b>Game Author</b>: ${idjson.author}<br>`:""}
        ${idjson.authorLink?`<b>Game Author Link</b>: <a style="color:#FFFF00;" href=${idjson.authorLink}>${idjson.authorLink}</a><br>`:""}
        ${idjson.special?`<b>Tags</b>: ${idjson.special}<br>`:""}
        <b>Gn-Math Adder</b>: ${json.at(-1).commit.author.name}<br>
        <b>Date Added</b>: ${formatteddate}<br>
        <b>Times Played (Globally)</b>: ${Number(stats).toLocaleString("en-US")}
        </p>`;
    })
}

function closePopup() {
    document.getElementById('popupOverlay').style.display = "none";
}
applySavedSettings();
// Pull owner settings from GitHub FIRST, then render zones so disabled list is correct
githubSyncPull().finally(() => {
    listZones();
    // After zones + settings are loaded, show MOTD and autofocus search if enabled
    if (getAutofocusSearch()) {
        setTimeout(() => document.getElementById('searchBar')?.focus(), 300);
    }
    setTimeout(maybeShowMotd, 800);
});

HTMLCanvasElement.prototype.toDataURL = function (...args) {
    return "";
};
