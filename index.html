// ── Play time ───────────────────────────────────────────────────────────────
let playSession = null;
function getPlaytimeMap() { const m = readJson(LIB_KEYS.playtime, {}); return m && typeof m === "object" ? m : {}; }
function getPlaytime(id) { return Number(getPlaytimeMap()[String(id)]) || 0; }
function formatPlaytime(sec) {
    const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60);
    return h ? `${h}h ${m}m` : `${Math.max(1, m)}m`;
}
function flushPlaytime() {
    if (!playSession || playSession.pending < 1) return;
    const map = getPlaytimeMap();
    map[playSession.id] = (Number(map[playSession.id]) || 0) + Math.round(playSession.pending);
    playSession.pending = 0;
    writeJson(LIB_KEYS.playtime, map);
}
function startPlaytime(id) {
    stopPlaytime();
    let last = Date.now();
    playSession = { id: String(id), pending: 0, timer: null };
    playSession.timer = setInterval(() => {
        const now = Date.now();
        // Only count time while the tab is visible (playing, not just left open)
        if (document.visibilityState === "visible") playSession.pending += Math.min(now - last, 10000) / 1000;
        last = now;
        if (playSession.pending >= 30) flushPlaytime();
    }, 5000);
}
function stopPlaytime() {
    if (!playSession) return;
    clearInterval(playSession.timer);
    flushPlaytime();

}

// ── My Stats ────────────────────────────────────────────────────────────────
function openStatsPanel() {
    const esc = t => String(t ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    const played = Object.entries(getPlaytimeMap())
        .map(([id, sec]) => ({ id, sec: Number(sec) || 0, zone: zoneById(id) }))

                <span style="width:1.2rem;color:var(--text-muted);font-weight:700;">${i + 1}</span>

                <span style="flex:1;height:8px;border-radius:99px;background:var(--bg-secondary);overflow:hidden;">
                    <span style="display:block;height:100%;width:${Math.max(4, Math.round(x.sec / max * 100))}%;background:var(--primary);border-radius:99px;"></span></span>
                <span style="flex:0 0 4.5rem;text-align:right;font-size:13px;color:var(--text-muted);">${formatPlaytime(x.sec)}</span>

        <p style="font-size:13px;color:var(--text-muted);margin:1rem 0 0;">

}

// ── "/" jumps to search ─────────────────────────────────────────────────────
window.addEventListener("keydown", e => {

// ── Shared ratings + broken reports (Firestore: gameStats/s0 … s15) ─────────
// Each shard doc holds { "z<id>": { v: { <uid>: 1 | -1 }, r: { <uid>: timestamp } } }.
// Rules only let a signed-in user change their own entry.
let gameStats = {};   // { "<id>": { up, down, reports, v: {uid: ±1}, r: {uid: ms} } }
function shardFor(id) { const n = Number(id) || 0; return "s" + (((n % STATS_SHARDS) + STATS_SHARDS) % STATS_SHARDS); }
function getZoneStats(id) { return gameStats[String(id)] || { up: 0, down: 0, reports: 0, v: {}, r: {} }; }
function ratingScore(id) {
    const s = getZoneStats(id);
    return (s.up + 1) / (s.up + s.down + 2); // smoothed % liked, so 1 vote doesn't beat 50
}
function summarizeStats(raw) {
    const out = {};
    const cutoff = Date.now() - BROKEN_REPORT_DAYS * 86400000;
    for (const [zk, entry] of Object.entries(raw)) {
        const id = zk.slice(1);
        const v = entry.v || {}, r = entry.r || {};
        const values = Object.values(v);
        out[id] = {
            up: values.filter(x => x === 1).length,
            down: values.filter(x => x === -1).length,
            reports: Object.values(r).filter(ms => ms >= cutoff).length,
            v, r

    }
    return out;
}
async function loadGameStats({ force = false } = {}) {
    const cached = readJson(LIB_KEYS.statsCache, null);
    if (cached && cached.raw) gameStats = summarizeStats(cached.raw);
    if (!force && cached && Date.now() - cached.t < STATS_CACHE_MS) return;
    if (typeof cloudDb === "undefined" || !cloudDb) return;
    try {
        const snap = await cloudDb.collection("gameStats").get();
        const raw = {};
        snap.docs.forEach(doc => {
            const data = doc.data() || {};
            for (const [zk, entry] of Object.entries(data)) {
                if (!/^z-?\d+$/.test(zk) || !entry || typeof entry !== "object") continue;
                const dest = raw[zk] || (raw[zk] = { v: {}, r: {} });
                for (const [uid, val] of Object.entries(entry.v || {})) if (val === 1 || val === -1) dest.v[uid] = val;
                for (const [uid, ts] of Object.entries(entry.r || {})) {
                    const ms = ts && typeof ts.toMillis === "function" ? ts.toMillis() : Number(ts) || 0;
                    dest.r[uid] = Math.max(dest.r[uid] || 0, ms);
                }
            }
        });
        writeJson(LIB_KEYS.statsCache, { t: Date.now(), raw });
        gameStats = summarizeStats(raw);
        refreshCards();
        const open = document.getElementById("zoneId")?.textContent;
        if (open && zoneViewer.style.display === "flex") updateRatingBar(open);
    } catch (e) {
        console.warn("Couldn't load ratings/reports", e);
    }
}
function updateRatingBar(id) {
    const s = getZoneStats(id);
    const uid = cloudUser && cloudUser.uid;
    const mine = uid ? s.v[uid] : undefined;
    const up = document.getElementById("rateUp"), down = document.getElementById("rateDown");
    if (!up || !down) return;
    document.getElementById("rateUpCount").textContent = s.up || "";
    document.getElementById("rateDownCount").textContent = s.down || "";
    up.classList.toggle("voted", mine === 1);
    down.classList.toggle("voted", mine === -1);
}
function statsErrorText(e) {
    const code = (e && e.code) || "";
    if (code.includes("permission-denied") || /insufficient permissions/i.test((e && e.message) || ""))
        return "this feature isn't switched on yet (the site owner needs to update the database rules).";
    return (e && e.message) || String(e);
}
function needAccountFor(what) {
    if (typeof FIREBASE_CONFIG === "undefined" || !FIREBASE_CONFIG) { alert(`${what} isn't available on this site.`); return true; }
    if (!cloudUser) {
        alert(`Sign in (or create a free account) to ${what.toLowerCase()}. It keeps it to one per person.`);
        openAccountPanel();
        return true;
    }
    return false;
}
async function writeGameStat(id, field, value, { remove = false } = {}) {
    const zk = "z" + String(id);
    const uid = cloudUser.uid;
    const stored = remove ? firebase.firestore.FieldValue.delete()
        : field === "r" ? firebase.firestore.FieldValue.serverTimestamp() : value;
    await cloudDb.collection("gameStats").doc(shardFor(id)).set({
        [zk]: { [field]: { [uid]: stored } },
        last: { z: zk, u: uid }
    }, { merge: true });
    // Update our local copy right away so the UI reacts instantly
    const cached = readJson(LIB_KEYS.statsCache, { t: 0, raw: {} });
    const entry = cached.raw[zk] || (cached.raw[zk] = { v: {}, r: {} });
    if (field === "v") { if (remove) delete entry.v[uid]; else entry.v[uid] = value; }
    if (field === "r") entry.r[uid] = Date.now();
    writeJson(LIB_KEYS.statsCache, cached);
    gameStats = summarizeStats(cached.raw);
}
async function rateCurrentZone(value) {
    const id = document.getElementById("zoneId").textContent;
    if (!id || needAccountFor("Rating games")) return;
    const current = getZoneStats(id).v[cloudUser.uid];
    try {
        // Clicking your current vote again removes it
        await writeGameStat(id, "v", value, { remove: current === value });
        updateRatingBar(id);
        refreshCards();
    } catch (e) {
        console.error(e);
        alert("Couldn't save your rating: " + statsErrorText(e));

}
async function reportBrokenShared(zone) {
    if (needAccountFor("Reporting broken games")) return;
    if (!confirm(`Report "${zone.name}" as broken? Games with ${BROKEN_FLAG_THRESHOLD}+ recent reports get a warning flag for everyone.`)) return;
    try {
        await writeGameStat(zone.id, "r", true);
        refreshCards();
        alert(`Thanks — "${zone.name}" has been reported. (${getZoneStats(zone.id).reports} report(s) in the last ${BROKEN_REPORT_DAYS} days.)`);
    } catch (e) {
        console.error(e);
        alert("Couldn't send the report: " + statsErrorText(e));
    }
}

// Remove every rating and report this account made (used by Delete account).
// The rules allow one game per write, so this writes once per game touched.
async function removeMyGameStats(uid) {
    const snap = await cloudDb.collection("gameStats").get();
    const del = firebase.firestore.FieldValue.delete();
    for (const doc of snap.docs) {
        const data = doc.data() || {};
        for (const [zk, entry] of Object.entries(data)) {
            if (!/^z-?\d+$/.test(zk) || !entry || typeof entry !== "object") continue;
            const mine = (entry.v && uid in entry.v) || (entry.r && uid in entry.r);
            if (!mine) continue;
            await doc.ref.set({ [zk]: { v: { [uid]: del }, r: { [uid]: del } }, last: { z: zk, u: uid } }, { merge: true });
        }
    }
    try { localStorage.removeItem(LIB_KEYS.statsCache); } catch {}
}

// Load cached stats immediately, then fresh ones once Firebase is ready
gameStats = summarizeStats((readJson(LIB_KEYS.statsCache, {}) || {}).raw || {});
(function waitForDb(tries) {
    if (typeof cloudDb !== "undefined" && cloudDb) return loadGameStats();
    if (tries > 0) setTimeout(() => waitForDb(tries - 1), 500);
})(40);
setInterval(() => { if (!document.hidden) loadGameStats(); }, STATS_CACHE_MS);

<script>
// ═════════════════════════════════════════════════════════════════════════════
// Game loading bar. gameProgressHook() is injected into every game page (see
// cleanGameHtml) and reports the game's own downloads (fetch + XHR) back here,
// so the bar shows real progress, size and an ETA for big games.
// ═════════════════════════════════════════════════════════════════════════════
function gameProgressHook() {
    var report = function (ev) {
        try { if (window.parent && window.parent !== window && window.parent.__gnmathLoadProgress) window.parent.__gnmathLoadProgress(ev); } catch (e) {}
    };
    var seq = 0;
    var origFetch = window.fetch;
    if (origFetch) {
        window.fetch = function () {
            var id = ++seq;
            report({ t: "start", id: id });
            return origFetch.apply(this, arguments).then(function (res) {
                try {
                    var total = Number(res.headers.get("content-length")) || 0;
                    report({ t: "progress", id: id, loaded: 0, total: total });
                    if (res.body && res.clone && !res.bodyUsed) {
                        var reader = res.clone().body.getReader();
                        var loaded = 0;
                        var pump = function () {
                            reader.read().then(function (r) {
                                if (r.done) { report({ t: "end", id: id, loaded: loaded, total: total }); return; }
                                loaded += r.value.byteLength;
                                report({ t: "progress", id: id, loaded: loaded, total: total });
                                pump();
                            }, function () { report({ t: "end", id: id, loaded: loaded, total: total }); });
                        };
                        pump();
                    } else {
                        report({ t: "end", id: id, loaded: total, total: total });
                    }
                } catch (e) { report({ t: "end", id: id }); }
                return res;
            }, function (err) { report({ t: "end", id: id }); throw err; });
        };
    }
    if (window.XMLHttpRequest) {
        var origSend = XMLHttpRequest.prototype.send;
        XMLHttpRequest.prototype.send = function () {
            var id = ++seq;
            report({ t: "start", id: id });
            this.addEventListener("progress", function (e) {
                report({ t: "progress", id: id, loaded: e.loaded, total: e.lengthComputable ? e.total : 0 });
            });
            this.addEventListener("loadend", function (e) {
                report({ t: "end", id: id, loaded: e.loaded || 0, total: e.lengthComputable ? e.total : 0 });
            });
            return origSend.apply(this, arguments);
        };
    }
}

const gameLoad = { phase: "idle", name: "", reqs: new Map(), samples: [], started: 0, pageWritten: 0, lastEnd: 0, everStarted: false, timer: null, showTimer: null };

function gameLoadEl() {
    let el = document.getElementById("gameLoadBar");
    if (!el) {
        el = document.createElement("div");
        el.id = "gameLoadBar";
        el.setAttribute("role", "progressbar");
        el.innerHTML = `<div class="glb-text"></div><div class="glb-stats"></div><div class="glb-track"><div class="glb-fill"></div></div>`;
        document.body.appendChild(el);
    }
    return el;
}
function fmtMB(bytes) {
    const mb = bytes / 1048576;
    return mb >= 100 ? `${Math.round(mb)} MB` : mb >= 10 ? `${mb.toFixed(1)} MB` : `${mb.toFixed(2)} MB`;
}
function fmtEta(sec) {
    if (!isFinite(sec) || sec <= 0) return "";
    if (sec < 60) return `about ${Math.max(1, Math.round(sec))}s left`;
    return `about ${Math.round(sec / 60)} min left`;
}

function setGameLoadText(title, stats) {
    const el = gameLoadEl();
    el.querySelector(".glb-text").textContent = title;
    const st = el.querySelector(".glb-stats");
    st.textContent = stats || "";
    st.style.display = stats ? "" : "none";
}

function beginGameLoad(file) {
    endGameLoad(true);
    Object.assign(gameLoad, { phase: "page", name: file.name, reqs: new Map(), samples: [], started: Date.now(), pageWritten: 0, lastEnd: 0, everStarted: false });
    const el = gameLoadEl();
    el.classList.remove("glb-done");
    // Don't flash the bar for games that open instantly
    gameLoad.showTimer = setTimeout(() => { if (gameLoad.phase !== "idle") el.classList.add("glb-show"); }, 700);
    gameLoad.timer = setInterval(renderGameLoad, 400);
    renderGameLoad();
}
function markGamePageWritten() {
    if (gameLoad.phase !== "page") return;
    gameLoad.phase = "game";
    gameLoad.pageWritten = Date.now();
}
function endGameLoad(immediate) {
    clearInterval(gameLoad.timer);
    clearTimeout(gameLoad.showTimer);
    gameLoad.phase = "idle";
    const el = document.getElementById("gameLoadBar");
    if (!el) return;
    if (immediate) { el.classList.remove("glb-show", "glb-done"); return; }
    el.classList.add("glb-done");
    el.querySelector(".glb-fill").style.width = "100%";
    el.querySelector(".glb-fill").classList.remove("glb-indeterminate");
    setGameLoadText(`${gameLoad.name} is ready!`, "");
    setTimeout(() => el.classList.remove("glb-show"), 900);
}

window.__gnmathLoadProgress = function (ev) {
    if (gameLoad.phase !== "page" && gameLoad.phase !== "game") return;
    const now = Date.now();
    let r = gameLoad.reqs.get(ev.id);
    if (!r) { r = { loaded: 0, total: 0, done: false, updated: now }; gameLoad.reqs.set(ev.id, r); }
    if (ev.t === "start") gameLoad.everStarted = true;
    if (typeof ev.loaded === "number") r.loaded = Math.max(r.loaded, ev.loaded);
    if (ev.total) r.total = ev.total;
    r.updated = now;
    if (ev.t === "end") { r.done = true; gameLoad.lastEnd = now; }
};

function renderGameLoad() {
    if (gameLoad.phase === "idle") return;
    const el = gameLoadEl();
    const text = el.querySelector(".glb-text");
    const fill = el.querySelector(".glb-fill");
    const now = Date.now();

    if (gameLoad.phase === "page") {
        setGameLoadText(`Opening ${gameLoad.name}…`, "");
        fill.classList.add("glb-indeterminate");
        return;
    }

    let loaded = 0, total = 0, allKnown = true, inFlight = 0;
    for (const r of gameLoad.reqs.values()) {
        loaded += r.loaded;
        if (r.total) total += Math.max(r.total, r.loaded); else if (r.loaded > 0 || !r.done) allKnown = false;
        // A request that hasn't moved for 15s (e.g. a stream that never ends) stops counting
        if (!r.done && now - r.updated < 15000) inFlight++;
    }

    // Download speed from the last ~4 seconds
    gameLoad.samples.push([now, loaded]);
    while (gameLoad.samples.length > 2 && now - gameLoad.samples[0][0] > 4000) gameLoad.samples.shift();
    const [t0, b0] = gameLoad.samples[0];
    const speed = now > t0 ? (loaded - b0) / ((now - t0) / 1000) : 0;

    // Finished: nothing downloading for a moment
    const idleSince = Math.max(gameLoad.pageWritten, gameLoad.lastEnd);
    const idleNeeded = gameLoad.everStarted ? 1500 : 5000;
    if (inFlight === 0 && now - idleSince > idleNeeded) { endGameLoad(); return; }

    if (!gameLoad.everStarted || loaded === 0) {
        setGameLoadText(`Starting ${gameLoad.name}…`, "");
        fill.classList.add("glb-indeterminate");
        return;
    }
    if (allKnown && total > 0) {
        const pct = Math.min(99, Math.floor(loaded / total * 100));
        const eta = speed > 0 ? fmtEta((total - loaded) / speed) : "";
        fill.classList.remove("glb-indeterminate");
        fill.style.width = pct + "%";
        el.setAttribute("aria-valuenow", pct);
        setGameLoadText(`Loading ${gameLoad.name}`, `${pct}% · ${fmtMB(loaded)} of ${fmtMB(total)}${eta ? " · " + eta : ""}`);
    } else {
        fill.classList.add("glb-indeterminate");
        el.removeAttribute("aria-valuenow");
        setGameLoadText(`Loading ${gameLoad.name}`, `${fmtMB(loaded)} downloaded${speed > 0 ? ` · ${fmtMB(speed)}/s` : ""}`);
    }
}

<script>
// ═════════════════════════════════════════════════════════════════════════════
// Per-game "More" menu + per-game data tracking.
// All games share this site's storage, so to clear ONE game's data the site
// records which storage keys each game writes (gameDataHook runs inside every
// game page) and later deletes only those.
// ═════════════════════════════════════════════════════════════════════════════
function gameDataHook() {
    var send = function (ev) {
        try { if (window.parent && window.parent !== window && window.parent.__gnmathTrackData) window.parent.__gnmathTrackData(ev); } catch (e) {}
    };
    try {
        var S = window.Storage && Storage.prototype;
        if (S) {
            var setItem = S.setItem;
            S.setItem = function (k) { if (this === window.localStorage) send({ t: "ls", key: String(k) }); return setItem.apply(this, arguments); };
        }
    } catch (e) {}
    try {
        var P = window.IDBObjectStore && IDBObjectStore.prototype;
        if (P) ["put", "add"].forEach(function (m) {
            var orig = P[m];
            P[m] = function () {
                var req = orig.apply(this, arguments);
                var db = this.transaction.db.name, store = this.name;
                req.addEventListener("success", function () { send({ t: "idb", db: db, store: store, key: req.result }); });
                return req;
            };
        });
        var C = window.IDBCursor && IDBCursor.prototype;
        if (C && C.update) {
            var upd = C.update;
            C.update = function () {
                try { var src = this.source; var os = src.objectStore || src; send({ t: "idb", db: os.transaction.db.name, store: os.name, key: this.primaryKey }); } catch (e) {}
                return upd.apply(this, arguments);
            };
        }
    } catch (e) {}
}

const GAME_DATA_KEY = "gnmath-gamedata";
let currentGameId = null;
let gameDataCache = null, gameDataDirty = false;

function loadGameData() {
    if (!gameDataCache) gameDataCache = readJson(GAME_DATA_KEY, {}) || {};
    return gameDataCache;
}
function saveGameDataSoon() {
    if (gameDataDirty) return;
    gameDataDirty = true;
    setTimeout(() => { gameDataDirty = false; writeJson(GAME_DATA_KEY, loadGameData()); }, 2000);
}
function keyId(k) {
    if (typeof k === "string") return "s:" + k;
    if (typeof k === "number" && isFinite(k)) return "n:" + k;
    return null; // arrays/dates/binary keys aren't tracked
}
function keyFromId(id) { return id.startsWith("n:") ? Number(id.slice(2)) : id.slice(2); }

window.__gnmathTrackData = function (ev) {
    if (!currentGameId) return;
    const all = loadGameData();
    const g = all[currentGameId] || (all[currentGameId] = { ls: [], idb: {} });
    if (ev.t === "ls") {
        if (ev.key.startsWith("gnmath-") || ev.key.startsWith("firebase:")) return;
        if (!g.ls.includes(ev.key)) { g.ls.push(ev.key); saveGameDataSoon(); }
    } else if (ev.t === "idb") {
        if (isCloudExcludedDb(ev.db)) return;
        const id = keyId(ev.key);
        if (!id) return;
        const stores = g.idb[ev.db] || (g.idb[ev.db] = {});
        const keys = stores[ev.store] || (stores[ev.store] = []);
        if (!keys.includes(id) && keys.length < 5000) { keys.push(id); saveGameDataSoon(); }
    }
};

function trackedItemCount(id) {
    const g = loadGameData()[String(id)];
    if (!g) return 0;
    let n = g.ls.length;
    for (const stores of Object.values(g.idb)) for (const keys of Object.values(stores)) n += keys.length;
    return n;
}

async function clearGameData(id) {
    const gid = String(id);
    const all = loadGameData();
    const g = all[gid];
    if (!g) return { removed: 0, skipped: 0 };
    // Anything another game also wrote is shared, so it's left alone
    const othersLs = new Set(), othersIdb = new Set();
    for (const [oid, og] of Object.entries(all)) {
        if (oid === gid) continue;
        og.ls.forEach(k => othersLs.add(k));
        for (const [db, stores] of Object.entries(og.idb)) for (const [st, keys] of Object.entries(stores)) keys.forEach(k => othersIdb.add(`${db}\u0000${st}\u0000${k}`));
    }
    let removed = 0, skipped = 0;
    for (const k of g.ls) {
        if (othersLs.has(k)) { skipped++; continue; }
        if (localStorage.getItem(k) !== null) { localStorage.removeItem(k); removed++; }
    }
    for (const [dbName, stores] of Object.entries(g.idb)) {
        const exists = indexedDB.databases ? (await indexedDB.databases()).some(d => d.name === dbName) : true;
        if (!exists) continue;
        const db = await new Promise(resolve => {
            const req = indexedDB.open(dbName);
            req.onsuccess = () => resolve(req.result);
            req.onerror = () => resolve(null);
            req.onupgradeneeded = () => { try { req.transaction.abort(); } catch {} resolve(null); };
        });
        if (!db) continue;
        try {
            const names = Object.keys(stores).filter(st => db.objectStoreNames.contains(st));
            if (!names.length) continue;
            const tx = db.transaction(names, "readwrite");
            for (const st of names) {
                const os = tx.objectStore(st);
                for (const kid of stores[st]) {
                    if (othersIdb.has(`${dbName}\u0000${st}\u0000${kid}`)) { skipped++; continue; }
                    os.delete(keyFromId(kid));
                    removed++;
                }
            }
            await new Promise(res => { tx.oncomplete = tx.onerror = tx.onabort = () => res(); });
        } finally {
            db.close();
        }
    }
    delete all[gid];
    writeJson(GAME_DATA_KEY, all);
    return { removed, skipped };
}

// ── The menu ────────────────────────────────────────────────────────────────
function currentZone() {
    const id = document.getElementById("zoneId")?.textContent;
    return id ? zoneById(id) : null;
}
function closeGameMenu() {
    document.getElementById("gameMenu")?.remove();
    document.getElementById("gameMenuButton")?.setAttribute("aria-expanded", "false");
}
function toggleGameMenu(ev) {
    ev?.stopPropagation();
    if (document.getElementById("gameMenu")) return closeGameMenu();
    const zone = currentZone();
    if (!zone) return;
    const btn = document.getElementById("gameMenuButton");
    btn.setAttribute("aria-expanded", "true");
    const menu = document.createElement("div");
    menu.id = "gameMenu";
    menu.setAttribute("role", "menu");
    const fav = isFavorite(zone.id);
    const tracked = trackedItemCount(zone.id);
    const items = [
        ["★", fav ? "Remove from favorites" : "Add to favorites", () => toggleFavorite(zone.id)],
        ["↻", "Restart game", () => openZone(zone)],
        ["ⓘ", "Game info", () => showZoneInfo()],
        "-",
        ["↗", "Open in new tab", () => aboutBlank()],
        ["⬇", "Download game file", () => downloadZone()],
        "-",
        ["⚠", "Report broken", () => reportCurrentZone()],
        ["🗑", `Clear this game's data${tracked ? "" : "…"}`, () => clearCurrentGameData(), true]
    ];
    for (const it of items) {
        if (it === "-") { const hr = document.createElement("div"); hr.className = "gm-sep"; menu.appendChild(hr); continue; }
        const [icon, label, fn, danger] = it;
        const b = document.createElement("button");
        b.type = "button";
        b.setAttribute("role", "menuitem");
        if (danger) b.className = "gm-danger";
        const i = document.createElement("span"); i.className = "gm-icon"; i.textContent = icon;
        const l = document.createElement("span"); l.textContent = label;
        b.append(i, l);
        b.onclick = (e) => { e.stopPropagation(); closeGameMenu(); fn(); };
        menu.appendChild(b);
    }
    document.body.appendChild(menu);
    const r = btn.getBoundingClientRect();
    menu.style.top = `${r.bottom + 6}px`;
    menu.style.right = `${Math.max(8, window.innerWidth - r.right)}px`;
    menu.querySelector("button")?.focus();
}
document.addEventListener("click", e => { if (!e.target.closest?.("#gameMenu")) closeGameMenu(); });
document.addEventListener("keydown", e => { if (e.key === "Escape") closeGameMenu(); });
window.addEventListener("resize", closeGameMenu);
// Clicking into the game (an iframe) moves focus away from the page
window.addEventListener("blur", () => setTimeout(() => { if (document.activeElement && document.activeElement.tagName === "IFRAME") closeGameMenu(); }, 0));

async function clearCurrentGameData() {
    const zone = currentZone();
    if (!zone) return;
    const n = trackedItemCount(zone.id);
    if (!n) {
        alert(`No saved data found for "${zone.name}".\n\nThe site can only clear data the game saved after this feature was added. Play it for a bit and it'll be able to clear it next time.`);
        return;
    }
    if (!confirm(`Clear all saved progress and settings for "${zone.name}"?\n\nOther games aren't affected. This can't be undone (unless you load an older cloud save or export file).`)) return;
    // Close the game first so it can't re-save what we delete
    closeZone();
    flushPlaytime && flushPlaytime();
    const { removed, skipped } = await clearGameData(zone.id);
    alert(`Cleared ${removed} saved item${removed === 1 ? "" : "s"} for "${zone.name}".` +
        (skipped ? `\n${skipped} item${skipped === 1 ? " was" : "s were"} also used by another game and kept.` : "") +
        (typeof cloudUser !== "undefined" && cloudUser ? "\nYour cloud save will update automatically." : ""));
    openZone(zone);
}
</script>
