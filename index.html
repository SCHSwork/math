    <script>
    // Tab title + icon are set before anything else so the tab cloak never flashes.
    (function () {
        var site = function (f) { return new URL(f, location.href).href; };
        window.GN_ICON_URL = site("assets/icons/favicon-64.png");
        var title = "GN 2.0", icon = window.GN_ICON_URL;
        try {
            if (localStorage.getItem("gnmath-tab-cloak-initialized")) {
                title = localStorage.getItem("gnmath-tab-cloak-title") || title;
                icon = localStorage.getItem("gnmath-tab-cloak-icon") || icon;
            } else {
                // First visit: the default cloak is Canvas
                title = "Dashboard";
                icon = "https://du11hjcvx0uqb.cloudfront.net/dist/images/favicon-e10d657a73.ico";
            }
        } catch (e) {}
        // Older saved values for the GN icon (before it moved to assets/icons/)
        if (icon === "favicon.png" || /\/favicon-64\.png$/.test(icon) && icon.indexOf("/assets/icons/") === -1) icon = window.GN_ICON_URL;
        document.title = title;
        var add = function (rel, href, extra) {
            var l = document.createElement("link"); l.rel = rel; l.href = href;
            for (var k in extra || {}) l.setAttribute(k, extra[k]);
            document.head.appendChild(l);
        };
        add("icon", icon);
        add("apple-touch-icon", site("assets/icons/apple-touch-icon.png"));
        add("manifest", site("manifest.json"));
    })();
    </script>
    <script>
        function gnmathBeforeUnloadHandler(event) {
            event.preventDefault();
            event.returnValue = '';
            return 'Are you sure you want to leave? Any unsaved changes will be lost.';
        }
    </script>
